<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The source of every bundled icon (32x32, 128x128, .ico, .icns).
    Regenerate them with:  npx tauri icon src-tauri/icons/icon.svg
    The drawing matches src/components/ui/Logo.tsx, which is the same mark in
    the app itself — change one, change the other.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1738"/>
      <stop offset="100%" stop-color="#0b0a16"/>
    </linearGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>

  <g transform="translate(256 256) scale(6) translate(-32 -32)">
    <ellipse cx="32" cy="32" rx="27" ry="10.5" fill="none" stroke="#8b5cf6" stroke-opacity="0.75" stroke-width="2.6" transform="rotate(-24 32 32)"/>
    <circle cx="32" cy="32" r="15.5" fill="url(#planet)"/>
    <circle cx="25" cy="26" r="4.2" fill="#ffffff" fill-opacity="0.32"/>
    <path d="M12.5 45.5 A 27 10.5 -24 0 0 51.5 18.5" fill="none" stroke="#8b5cf6" stroke-opacity="0.75" stroke-width="2.6"/>
    <circle cx="32" cy="5" r="3.6" fill="#ec4899"/>
  </g>
</svg>
