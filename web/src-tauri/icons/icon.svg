<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The source of every bundled icon (32x32, 128x128, .ico, .icns).
    Regenerate them with:  npx tauri icon src-tauri/icons/icon.svg

    The drawing is the mark from src/assets/orbit-mark.svg, dressed in Orbit's
    own colours and sitting on its own background. The same paths appear in
    src/components/ui/Logo.tsx, which is where the in-app version and its
    animation live — change one, change the other.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1738"/>
      <stop offset="100%" stop-color="#0b0a16"/>
    </linearGradient>
    <linearGradient id="ink" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <mask id="lit">
      <rect width="512" height="512" fill="white"/>
      <ellipse cx="330" cy="256" rx="62" ry="104" fill="black" fill-opacity="0.55"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="232" fill="url(#glow)"/>

  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
    <g fill="url(#ink)" stroke="url(#ink)">
      <g transform="translate(256 256)">
        <circle r="206" fill="none" stroke-width="18" stroke-linecap="round"
                stroke-dasharray="451 100 645 100" transform="rotate(276)"/>
        <circle cx="118" cy="169" r="36"/>
      </g>
      <g transform="translate(256 256)" opacity="0.6">
        <circle r="152" fill="none" stroke-width="12" stroke-linecap="round"
                stroke-dasharray="477 478" transform="rotate(69)"/>
      </g>
      <circle cx="256" cy="256" r="104" mask="url(#lit)"/>
      <path d="M227 22 Q 231 48 257 52 Q 231 56 227 82 Q 223 56 197 52 Q 223 48 227 22 Z"/>
    </g>
  </g>
</svg>
