[package]
name = "orbit"
version = "1.1.0"
description = "Orbit - a modern game launcher and playtime tracker"
authors = ["you"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.90"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2.5.2"
# `rt` supports spawn/spawn_blocking and `time` drives the session watcher.
# The macros feature is not used, so it is deliberately left out.
tokio = { version = "1.53.1", features = ["rt", "time"] }
jpeg-encoder = "0.6"
jpeg-decoder = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "charset",
    "gzip",
    "http2",
    "json",
    "query",
    "rustls",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already used by the web view. Named here so a minimise can reach the GTK
# window, and so compositing can be turned off on that view.
gdk = "0.18.2"
glib = "0.18.5"
gtk = "0.18.2"
# A real `fcntl`, not a hand-declared variadic. The hand-declared one was
# enough to take the process down when a controller was opened.
libc = "0.2"
x11rb = "0.13.2"
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Media_MediaFoundation",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
    "Media_Control",
    "Storage_Streams",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Own workspace root, so this crate is never absorbed by an outer Cargo project.
[workspace]
