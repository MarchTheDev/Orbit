[package]
name = "orbit"
version = "1.0.1"
description = "Orbit - a modern game launcher and playtime tracker"
authors = ["you"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.90"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
# `rt` supports spawn/spawn_blocking and `time` drives the session watcher.
# The macros feature is not used, so it is deliberately left out.
tokio = { version = "1.53.1", features = ["rt", "time"] }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "charset",
    "gzip",
    "http2",
    "json",
    "query",
    "rustls",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Own workspace root, so this crate is never absorbed by an outer Cargo project.
[workspace]
