[package]
name = "orbit"
version = "0.1.2"
description = "Orbit - a modern game launcher and playtime tracker"
authors = ["you"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# rt is the runtime (spawn, spawn_blocking) and time is the interval the session
# watcher ticks on. The macros feature was asked for here but never used, and it
# is the one thing that pulls tokio-macros into the build: a lock file that never
# heard of it made the offline Nix build stop, correctly, rather than guess.
tokio = { version = "1.53.1", features = ["rt", "time"] }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "charset",
    "gzip",
    "http2",
    "json",
    "query",
    "rustls",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Own workspace root, so this crate is never absorbed by an outer Cargo project.
[workspace]
